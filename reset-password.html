<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Lake County Student Rides</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo-mark.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">
        <img src="/assets/logo-mark.svg" alt="" width="42" height="42" class="brand-mark-img" />
        <span class="brand-name">Lake County<br>Student Rides</span>
      </a>
      <span style="font-weight:700; color:var(--navy-dark);" data-i18n-es="Portal para Padres">Parent Portal</span>
      <button type="button" class="btn btn-ghost" data-lang-toggle style="margin-left:auto;">Español</button>
    </div>
  </header>

  <main>
    <section class="section booking-section">
      <div class="wrap booking-wrap">

        <div id="request-panel">
          <h1 data-i18n-es="Restablezca su Contraseña">Reset Your Password</h1>
          <p class="section-lede" data-i18n-es="Ingrese el correo electrónico de su cuenta de padre/madre y le enviaremos un enlace para restablecerla.">Enter the email on your parent account and we'll send you a reset link.</p>
          <div class="form-row">
            <label for="requestEmail" data-i18n-es="Correo electrónico">Email</label>
            <input id="requestEmail" type="email" autocomplete="email" />
          </div>
          <button id="request-btn" class="btn btn-primary btn-lg" data-i18n-es="Enviar Enlace de Restablecimiento">Send Reset Link</button>
          <div id="request-message" class="price-note" role="status" hidden></div>
          <div id="request-error" class="price-error" role="alert" hidden></div>
        </div>

        <div id="confirm-panel" hidden>
          <h1 data-i18n-es="Elija una Nueva Contraseña">Choose a New Password</h1>
          <p class="section-lede" data-i18n-es="Ingrese una nueva contraseña para su cuenta de padre/madre.">Enter a new password for your parent account.</p>
          <div class="form-row">
            <label for="newPassword" data-i18n-es="Nueva contraseña">New password</label>
            <input id="newPassword" type="password" autocomplete="new-password" />
          </div>
          <button id="confirm-btn" class="btn btn-primary btn-lg" data-i18n-es="Restablecer Contraseña">Reset Password</button>
          <div id="confirm-message" class="price-note" role="status" hidden></div>
          <div id="confirm-error" class="price-error" role="alert" hidden></div>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>&copy; <span id="year"></span> <span data-i18n-es="Lake County Student Rides. Todos los derechos reservados.">Lake County Student Rides. All rights reserved.</span></p>
    </div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/reset-password.js"></script>
</body>
</html>
