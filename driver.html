<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Dashboard | Lake County Student Rides</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo-mark.svg" />
  <link rel="manifest" href="/driver-manifest.json" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <meta name="theme-color" content="#16324f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LCSR Driver" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">
        <img src="/assets/logo-mark.svg" alt="" width="42" height="42" class="brand-mark-img" />
        <span class="brand-name">Lake County<br>Student Rides</span>
      </a>
      <span style="font-weight:700; color:var(--navy-dark);" data-i18n-es="Panel del Conductor">Driver Dashboard</span>
      <button type="button" class="btn btn-ghost" data-lang-toggle style="margin-left:auto;">Español</button>
    </div>
  </header>

  <main>
    <section class="section booking-section">
      <div class="wrap booking-wrap">
        <div id="login-panel">
          <h1 data-i18n-es="Inicio de Sesión del Conductor">Driver Login</h1>
          <p class="section-lede" data-i18n-es="Ingrese su código de acceso de conductor para ver los viajes de hoy.">Enter your driver access code to see today's trips.</p>
          <div class="form-row">
            <label for="driverToken" data-i18n-es="Código de acceso">Access code</label>
            <input id="driverToken" type="password" autocomplete="off" />
          </div>
          <button id="login-btn" class="btn btn-primary btn-lg" data-i18n-es="Desbloquear Panel">Unlock Dashboard</button>
          <div id="login-error" class="price-error" role="alert" hidden></div>
        </div>
      </div>
    </section>

    <section class="section booking-section">
      <div class="wrap">
        <div id="trips-panel" class="driver-columns" hidden>
          <div>
            <div id="clock-card" class="price-result" style="margin-top:0; margin-bottom:1.5rem;">
              <div class="price-row price-row-total">
                <span data-i18n-es="Reloj de Trabajo">Time Clock</span>
                <span id="clock-status-label" data-i18n-es="Fuera de servicio">Clocked Out</span>
              </div>
              <div class="price-row"><span data-i18n-es="Horas de hoy">Hours Today</span><span id="clock-today-hours">0.00</span></div>
              <button id="clock-btn" type="button" class="btn btn-primary" style="margin-top:0.75rem;" data-i18n-es="Marcar Entrada">Clock In</button>
              <div id="clock-error" class="price-error" role="alert" hidden></div>
            </div>
            <h1 data-i18n-es="Viajes de Hoy">Today's Trips</h1>
            <p class="section-lede" data-i18n-es="Reservas más recientes primero.">Most recent bookings first.</p>
            <button id="refresh-btn" class="btn btn-ghost" style="margin-bottom:1rem;" data-i18n-es="Actualizar">Refresh</button>
            <button id="logout-btn" class="btn btn-ghost" style="margin-bottom:1rem;" data-i18n-es="Cerrar Sesión">Log Out</button>
            <div id="trip-list"></div>
            <div id="trips-error" class="price-error" role="alert" hidden></div>
          </div>
          <div>
            <h2 data-i18n-es="Lista de Hoy">Today's Roster</h2>
            <p class="section-lede" data-i18n-es="Se reinicia automáticamente cada día.">Resets automatically every day.</p>
            <div id="today-summary"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>&copy; <span id="year"></span> <span data-i18n-es="Lake County Student Rides. Todos los derechos reservados.">Lake County Student Rides. All rights reserved.</span></p>
    </div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/driver.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
